<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Quiz Jump</title>

<style>

@font-face{
  font-family:"ABBvoice Display";
  src:
    url("ABBvoiceDisplay_W_SBd.woff") format("woff");
  font-weight:600;
  font-style:normal;
  font-display:swap;
}


@font-face{
  font-family:"ABBvoice";
  src:
    url("Web/WOFF2/ABBvoice_W_Rg.woff2") format("woff2"),
    url("Web/WOFF/ABBvoice_W_Rg.woff") format("woff");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"ABBvoice";
  src:
    url("Web/WOFF2/ABBvoice_W_Md.woff2") format("woff2"),
    url("Web/WOFF/ABBvoice_W_Md.woff") format("woff");
  font-weight:500;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"ABBvoice";
  src:
    url("ABBvoiceDisplay_W_SBd.woff") format("woff");
  font-weight:600;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"ABBvoice";
  src:
    url("Web/WOFF2/ABBvoice_W_Bd.woff2") format("woff2"),
    url("Web/WOFF/ABBvoice_W_Bd.woff") format("woff");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}


:root{
  --red:#ff0011;
  --green:#18b57c;
  --ink:#111111;
  --paper:#ffffff;
  --line:#d8d8d8;
}

*{
  box-sizing:border-box;
}

html,
body{
  font-family:"ABBvoice", Arial, sans-serif;
  width:100%;
  min-height:100dvh;
  margin:0;
}

body{
  font-family:"ABBvoice", Arial, sans-serif;

  display:grid;
  place-items:center;
  background:#9a9a9a;
  font-family:"ABBvoice", Arial, sans-serif;
  color:var(--ink);
  overflow:hidden;
}

button,
input{
  font-family:"ABBvoice", Arial, sans-serif;
  font:inherit;
  color:inherit;
}


/* =========================================================
   MAIN DISPLAY
   Target: 1910 × 2160
   ========================================================= */

.phone{
  width:min(
    100vw,
    1910px,
    calc(100dvh * 1910 / 2160)
  );

  aspect-ratio:1910 / 2160;

  max-height:100dvh;

  background:#fff;

  border:0;

  border-radius:18px;

  overflow:hidden;

  box-shadow:0 1px 0 rgba(0,0,0,.12);

  container-type:inline-size;
}


/* =========================================================
   LANDING PAGE
   Refined to match the supplied landing-page reference and ABBvoice typography.
   ========================================================= */

.landing{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #f3f3f3 0 32%,
      #ffffff 32% 100%
    );
}


/* White ground band + ground line
   The reference landing page has the robot standing on a
   clean white ground rather than on the light-grey background. */

.landing::before{
  content:"";

  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:17.2%;

  background:#ffffff;
  z-index:2;
  pointer-events:none;
}

.landing::after{
  content:"";

  position:absolute;
  left:0;
  right:0;

  bottom:0;

  height:35%;

  background:#ffffff;
  border-top:2px solid #d8d8d8;
  box-sizing:border-box;
  z-index:3;
  pointer-events:none;
}


/* Landing information */

.landing-meta{
  font-family:"ABBvoice", Arial, sans-serif;
  position:absolute;

  top:3.1%;
  left:5.3%;

  z-index:8;

  display:flex;
  flex-direction:column;

  gap:.7cqw;

  font-size:
    clamp(
      10px,
      1.7cqw,
      32px
    );

  line-height:1.25;
}


/* Landing hearts */

.landing-lives{
  font-family:"ABBvoice", Arial, sans-serif;
  position:absolute;

  top:3.2%;
  right:5.1%;

  z-index:8;

  display:flex;

  gap:.45cqw;
}

.landing-lives img{
  width:4.1cqw;
  height:4.1cqw;

  min-width:20px;
  min-height:20px;

  object-fit:contain;
}



/* How to play */

.how-to-play{
  position:absolute;

  z-index:4;

  left:11.8%;
  top:33%;

  width:50%;

  color:#5a5a5a;

  font-size:
    clamp(
      12px,
      2cqw,
      36px
    );

  line-height:1.42;

  font-weight:400;
}

.how-to-play-title{
  display:block;

  margin-bottom:.25cqw;

  font-weight:400;
}

.how-to-play ol{
  margin:0;

  padding-left:2.1cqw;
}

.how-to-play li{
  padding-left:.35cqw;
}


/* Landing title */

.landing-title{
  font-family:"ABBvoice Display", "ABBvoice", Arial, sans-serif;
  font-weight:600;
  position:absolute;

  z-index:4;

  left:11.8%;
  top:22.2%;

  width:80%;

  margin:0;

  /* Keep the heading from creating a single-word widow on the next line. */
  white-space:nowrap;

  font-size:
    clamp(
      24px,
      4.4cqw,
      90px
    );

  line-height:1.22;

  letter-spacing:-.035em;
}


/* Landing bricks */

.landing-brick{
  position:absolute;

  z-index:1;

  /* Increased to match the larger, more visible brick clusters
     in the supplied landing-page reference. */
  width:25.5%;
  height:auto;

  opacity:.68;

  pointer-events:none;
}

.landing-brick.top{
  top:-1.5%;
  right:28%;

  transform:scale(1);
}

.landing-brick.left{
  left:-1%;
  bottom:27%;

  transform:scale(1);
}

.landing-brick.right{
  right:-1%;
  bottom:27%;

  transform:scale(.96);
}


/* Landing bubble */

.landing-bubble{
  font-family:"ABBvoice", Arial, sans-serif;
  position:absolute;

  z-index:6;

  right:7.4%;
  bottom:27.5%;

  width:34%;

  aspect-ratio:590 / 359;

  background:
    url("Thought box 2.png")
    center / 100% 100%
    no-repeat;

  display:grid;

  place-items:center;

  padding:7% 8% 12%;

  font-size:
    clamp(
      11px,
      2.2cqw,
      40px
    );

  line-height:1.25;

  text-align:left;

  white-space:nowrap;
}


/* Landing robot */

.landing-robot{
  position:absolute;

  z-index:5;

  right:18.5%;
  bottom:12%;

  width:15.8%;
  height:auto;

  object-fit:contain;

  image-rendering:auto;
}


/* Landing shadow */

.landing-shadow{
  position:absolute;

  z-index:4;

  right:17.7%;
  bottom:10%;

  width:18%;
  height:auto;

  opacity:.72;
}


/* Name field */

.name-input{
  font-family:"ABBvoice", Arial, sans-serif;
  position:absolute;

  z-index:7;

  left:8%;
  top:75.4%;

  width:29.3%;
  height:6.2%;

  min-height:52px;

  border:2px solid #d9d9d9;

  border-radius:1.2cqw;

  background:#ffffff;

  padding:0 1.5cqw;

  outline:none;

  font:
    700
    clamp(
      12px,
      1.75cqw,
      34px
    )
    "ABBvoice",
    Arial,
    sans-serif;
}

.name-input::placeholder{
  color:#222;
  opacity:1;
}

.name-input:focus{
  border-color:#bcbcbc;
}


/* =========================================================
   ROLE DROPDOWN
   ========================================================= */

.role-select-wrapper{
  position:absolute;
  z-index:100;
  left:8%;
  top:75.4%;
  width:29.3%;
  height:6.2%;
  min-height:52px;
  box-sizing:border-box;
}

.role-select-trigger{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 1.5cqw;
  border:3.5px solid #d9d9d9;
  border-radius:1.2cqw;
  background:#fff;
  color:#222;
  font-family:"ABBvoice", Arial, sans-serif;
  font-size:clamp(12px, 1.75cqw, 34px);
  font-weight:400;
  line-height:1.2;
  text-align:left;
  cursor:pointer;
  pointer-events:auto;
  outline:none;
  transition:border-color 140ms ease, box-shadow 140ms ease;
}

.role-select-trigger.placeholder{color:#6a6a6a;}
.role-select-trigger:hover{border-color:#bcbcbc;}
.role-select-trigger:focus-visible{border-color:#999; box-shadow:0 0 0 2px rgba(0,0,0,.04);}

.role-caret{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:1.35em;
  height:1.35em;
  margin-left:1cqw;
  font-family:"ABBvoice", Arial, sans-serif;
  font-size:1em;
  font-weight:500;
  line-height:1;
  color:#222;
  pointer-events:none;
  transform:translateY(-.04em);
}

.role-menu{
  position:absolute;
  left:1.5%;
  right:1.5%;
  bottom:calc(100% + .65cqw);
  display:flex;
  flex-direction:column;
  padding:.55cqw 0;
  background:#fff;
  border:1.5px solid #bfbfbf;
  border-radius:1cqw;
  box-shadow:0 .7cqw 1.8cqw rgba(0,0,0,.16), 0 .15cqw .35cqw rgba(0,0,0,.08);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(.45cqw);
  transition:opacity 140ms ease, transform 140ms ease, visibility 140ms ease;
}

.role-select-wrapper.open .role-menu{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0);
}

.role-option{
  width:100%;
  display:block;
  padding:.72cqw 1.25cqw;
  border:0;
  background:transparent;
  color:#222;
  font-family:"ABBvoice", Arial, sans-serif;
  font-size:clamp(12px, 1.7cqw, 33px);
  font-weight:400;
  line-height:1.25;
  text-align:left;
  white-space:nowrap;
  cursor:pointer;
}

.role-option:hover,.role-option:focus-visible{background:#f4f4f4; outline:none;}
.role-option:active{background:#ededed;}
.role-option.selected{font-weight:500;}

/* Start button */




.start-quiz{
  font-family:"ABBvoice", Arial, sans-serif;
  font-weight:500;
  position:absolute;

  z-index:9;

  left:8%;
  top:83.7%;

  transform:none;

  border:0;

  border-radius:1.9cqw;

  background:var(--red);

  color:#fff;

  min-width:11.2%;
  min-height:6.3%;

  padding:
    1.2cqw
    2.6cqw;

  font-size:
    clamp(
      14px,
      2.15cqw,
      42px
    );

  cursor:pointer;

  transition:
    transform 140ms ease,
    filter 140ms ease;
}

.start-quiz:disabled{
  opacity:.55;
  cursor:not-allowed;
  filter:none;
}

.start-quiz:disabled:hover{
  filter:none;
  transform:none;
}

.start-quiz:hover{
  filter:brightness(.96);

  transform:
    translateY(-1px);
}

.start-quiz:active{
  transform:
    translateY(1px);
}


/* =========================================================
   QUIZ GAME
   ========================================================= */

.game{
  position:relative;

  width:100%;
  height:100%;

  display:grid;

  grid-template-rows:
    57%
    43%;

  background:#fff;
}

.game.hidden{
  display:none;
}


/* =========================================================
   GAME WORLD
   ========================================================= */

.stage{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #f3f3f3 0 32%,
      #ffffff 32% 100%
    );

  border-bottom:2px solid #d8d8d8;
}


/* =========================================================
   GAME HEADER
   ========================================================= */

.hud{
  font-family:"ABBvoice", Arial, sans-serif;
  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:20;

  height:13.5%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0
    5.3%;

  background:#fff;

  border-bottom:4px solid #dedede;

  font-size:
    clamp(
      12px,
      2.05cqw,
      40px
    );
}


/* Question number */

#questionLabel{
  display:block;

  line-height:1;

  margin-top:-1%;
}


/* Lives */

.lives{
  display:flex;

  align-items:center;

  gap:.35cqw;
}

.life{
  width:4.1cqw;
  height:4.1cqw;

  min-width:22px;
  min-height:22px;

  object-fit:contain;
}


/* =========================================================
   PLATFORM LAYER
   ========================================================= */

.platform-layer{
  position:absolute;

  left:0;
  right:0;
  top:13.5%;
  bottom:0;

  z-index:1;

  pointer-events:none;

  transition:
    transform
    720ms
    cubic-bezier(.22,1,.36,1);
}

.platform-source{
  display:none;
}


/* Platform */

.platform{
  position:absolute;

  width:38.7%;

  height:8.75%;

  background:
    linear-gradient(
      #ff0011 0 78%,
      #df000d 78% 100%
    );

  opacity:0;

  transition:
    opacity 180ms ease;
}

.platform.left{
  left:0;
}


.platform.right{
  right:0;
}


/* =========================================================
   WINNING FLAG
   Shown only when all 5 answers are correct and all lives
   are still intact. It sits on the final red platform.
   ========================================================= */

.winning-flag{
  position:absolute;

  z-index:4;

  width:9.5%;

  height:auto;

  left:14%;

  top:0;

  display:block;

  opacity:0;

  pointer-events:none;

  image-rendering:auto;

  transform-origin:center bottom;

  transition:
    opacity 220ms ease,
    transform 220ms ease;
}

.winning-flag.show{
  opacity:1;

  transform:translateY(0);
}



/* =========================================================
   DECORATIVE BRICKS
   ========================================================= */

.brick{
  position:absolute;

  z-index:0;

  width:24%;
  height:20%;

  opacity:.95;

  background:
    url("Brick.png")
    center / contain
    no-repeat;
}

.brick.one{
  right:40%;
  top:7%;

  transform:scale(1.1);
}

.brick.two{
  left:2%;
  top:72%;

  transform:scale(1.12);
}

.brick.three{
  right:2%;
  top:72%;

  transform:scale(1.06);
}


/* =========================================================
   ROBOT
   ========================================================= */

.hero{
  position:absolute;

  left:50%;
  top:auto;
  bottom:0;

  z-index:5;

  width:13.8%;
  height:27%;

  transform:translateX(-50%);

  will-change:
    left,
    top,
    transform;

  backface-visibility:hidden;
}

.hero.wrong{
  animation:
    wobble
    420ms
    ease-in-out;
}


/* Robot shadow */

.hero-shadow{
  position:absolute;

  left:50%;
  bottom:-1px;

  width:80%;

  transform:translateX(-50%);

  opacity:.7;

  image-rendering:auto;
}


/* Robot sprite */

.hero-sprite{
  display:block;

  position:absolute;

  left:50%;
  bottom:0;

  /*
    Both sprite layers share exactly the same visual box.
    Crossfading between the four supplied poses removes the
    hard "teleport" that can happen when one image is replaced.
  */
  width:100%;
  height:100%;

  max-width:none;

  object-fit:contain;
  object-position:center bottom;

  transform:
    translateX(-50%)
    scaleX(var(--face-dir,1));

  z-index:2;

  transform-origin:
    center bottom;

  image-rendering:auto;

  backface-visibility:hidden;

  opacity:0;

  transition:
    opacity 95ms linear;
}

.hero-sprite.is-visible{
  opacity:1;
}


/* =========================================================
   THOUGHT BUBBLE
   ========================================================= */

.bubble{
  position:absolute;

  z-index:6;

  left:50%;
  top:43%;

  width:35%;
  height:29%;

  transform:scale(.96);

  display:grid;

  place-items:center;

  box-sizing:border-box;

  padding:
    2%
    3%
    5%;

  background:
    url("Thought box 1.png")
    center / 100% 100%
    no-repeat;

  font-size:
    clamp(
      8px,
      1.6cqw,
      30px
    );

  line-height:1.25;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transition:
    opacity 200ms ease,
    transform 220ms ease;
}

.bubble.show{
  opacity:1;

  transform:scale(1);
}

.bubble.large{
  width:37.5%;
  height:30%;

  background-image:
    url("Thought box 2.png");
}


/* =========================================================
   QUESTION / ANSWER PANEL
   ========================================================= */

.quiz{
  position:relative;

  z-index:10;

  /*
    Keep the existing 1910 × 2160 interface ratio
    and the slightly expanded 57% / 43% game split.

    Quiz-area and panel padding are reduced to 75%
    of the previous values. The answer panel still
    sizes to its content instead of stretching to
    the full height of the lower section.
  */

  padding:
    4.2%
    5.2%
    4.2%;

  background:#fff;
}


/* Main panel */

.panel{
  width:100%;
  height:auto;

  border:
    0.525cqw
    solid
    #c9c9c9;

  border-radius:
    1.4cqw;
  padding:
    3.0cqw
    3.0cqw
    3.0cqw
    3.0cqw;

  background:#fff;
}


/* Question */

.prompt{
  font-family:"ABBvoice", Arial, sans-serif;
  font-weight:500;
  margin:
    0
    0
    3.2cqw;

  font-size:
    clamp(
      12px,
      2.55cqw,
      49px
    );

  line-height:1.2;

  letter-spacing:-.015em;
}


/* Answer grid */

.answers{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:
    2.0cqw
    2.0cqw;
}


/* Answer buttons */

.answer{
  font-family:"ABBvoice", Arial, sans-serif;
  min-height:
    clamp(
      55px,
      6.2cqw,
      118px
    );

  border:
    2px
    solid
    #dddddd;

  border-radius:
    1cqw;

  background:#fff;

  padding:
    1.15cqw
    1.8cqw;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  text-align:left;

  font-size:
    clamp(
      10px,
      1.9cqw,
      37px
    );

  line-height:1.25;

  cursor:pointer;

  transition:
    border-color 140ms ease,
    background 140ms ease,
    transform 140ms ease;
}


/* Touch feedback */

.answer:hover:not(:disabled){
  border-color:#adadad;

  transform:
    translateY(-1px);
}

.answer:active:not(:disabled){
  transform:
    translateY(1px);
}


/* Correct */

.answer.correct{
  border-color:var(--green);

  background:#f8fffc;
}


/* Wrong */

.answer.wrong{
  border-color:var(--red);

  background:#fffafa;
}

.answer:disabled{
  cursor:default;
}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

.next{
  font-family:"ABBvoice", Arial, sans-serif;
  font-weight:500;
  display:block;
  margin:2.0cqw auto 0;
  border:0;
  border-radius:1.7cqw;
  background:var(--red);
  color:#fff;
  min-width:21%;
  min-height:6.2cqw;
  padding:1.0cqw 2.5cqw;
  font-size:clamp(12px, 1.75cqw, 34px);
  line-height:1.1;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transform:translateY(4px);
  transition:opacity 180ms ease, transform 180ms ease, filter 140ms ease;
}

.next.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.next:hover{
  filter:brightness(.96);
}

.next:active{
  transform:translateY(1px);
}


/* =========================================================
   END-OF-QUIZ ANIMATIONS
   ========================================================= */

.result-animation{
  width:100%;
  height:clamp(150px, 24cqw, 270px);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:1.5%;
  overflow:visible;
}

.result-animation img{
  display:block;
  width:auto;
  height:auto;
  max-width:90%;
  max-height:100%;
  object-fit:contain;
}

.result-animation.heartbreak img{
  width:clamp(90px, 15cqw, 140px);
}

.result-animation.trofee img{
  height:clamp(90px, 17cqw, 216px);
}

/* =========================================================
   RESULT
   ========================================================= */

.result{
  display:none;

  width:100%;
  height:100%;

  place-items:center;
  padding:6%;
  text-align:center;
  background:#fff;
}

.result.active{
  display:grid;
}

.result-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.result h1{
  font-family:"ABBvoice Display", "ABBvoice", Arial, sans-serif;
  margin:0 0 2%;
  font-size:clamp(28px, 4.2cqw, 72px);
  line-height:1.1;
}

.result-score{
  font-family:"ABBvoice Display", "ABBvoice", Arial, sans-serif;
  margin:0 0 1.5%;
  font-size:clamp(42px, 7cqw, 110px);
  line-height:1;
}

.result p{
  font-family:"ABBvoice", Arial, sans-serif;
  margin:0 0 3%;
  font-size:clamp(13px, 1.8cqw, 32px);
  line-height:1.4;
}

.restart{
  font-family:"ABBvoice", Arial, sans-serif;
  font-weight:500;

const QUIZ_SIZE = 5;
let sessionQuestions = [];
let lastSessionKey = "";

function shuffleArray(items){
  const shuffled = [...items];
  for(let index = shuffled.length - 1; index > 0; index -= 1){
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
  }
  return shuffled;
}

function createQuizSession(role){
  const roleQuestions = questionBank.filter(question => question.sectionCode === role);

  if(roleQuestions.length < QUIZ_SIZE){
    throw new Error(`Not enough questions for role ${role}. Need ${QUIZ_SIZE}, found ${roleQuestions.length}.`);
  }

  let selected;
  let sessionKey;

  do{
    selected = shuffleArray(roleQuestions).slice(0, QUIZ_SIZE);
    sessionKey = selected.map(question => question.questionCode).sort().join("|");
  }while(roleQuestions.length > QUIZ_SIZE && sessionKey === lastSessionKey);

  lastSessionKey = sessionKey;
  return selected;
}

/* =========================================================
   BUILD PLATFORMS
   ========================================================= */

function buildPlatforms(){

  platformStops.forEach(
    (stop,index) => {

      if(
        stop.side === "floor"
      ){
        return;
      }

      const platform =
        document.createElement(
          "div"
        );

      platform.className =
        `platform ${stop.side}`;

      platform.dataset.index =
        index;

      platformLayer.appendChild(
        platform
      );

    }
  );

}


/* =========================================================
   POSITION PLATFORM
   ========================================================= */

function positionPlatform(
  platform,
  side,
  top,
  opacity
){

  platform.className =
    `platform ${side}`;

  platform.style.top =
    `${top}px`;

  platform.style.opacity =
    opacity;

}


/* =========================================================
   RENDER PLATFORMS
   ========================================================= */

function renderPlatforms(step){

  [
    ...platformLayer
      .querySelectorAll(
        ".platform"
      )
  ]
  .forEach(platform => {

    const platformIndex =
      Number(
        platform.dataset.index
      );


    if(
      platformIndex ===
      Math.max(1,step)
    ){

      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        lowerStepTop(),

        1
      );

    }

    else if(
      platformIndex ===
      Math.max(1,step) + 1
    ){

      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        upperStepTop(),

        1
      );

    }

    else{

      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        platformIndex < step
          ? -56
          : 280,

        0
      );

    }

  });

}


/* =========================================================
   RENDER JUMPING PLATFORMS
   ========================================================= */

function renderJumpingPlatforms(
  fromStep,
  toStep,
  progress
){

  const travel =
    lowerStepTop()
    -
    upperStepTop();


  [
    ...platformLayer
      .querySelectorAll(
        ".platform"
      )
  ]
  .forEach(platform => {

    const platformIndex =
      Number(
        platform.dataset.index
      );


    if(
      platformIndex === fromStep &&
      fromStep > 0
    ){

      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        lowerStepTop()
        +
        travel * progress,

        1 - progress
      );

    }

    else if(
      platformIndex === toStep
    ){

      const top =
        fromStep === 0
          ? lowerStepTop()
          : upperStepTop()
            +
            travel * progress;


      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        top,

        1
      );

    }

    else if(
      platformIndex ===
      toStep + 1
    ){

      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        upperStepTop(),

        fromStep === 0
          ? 1
          : progress
      );

    }

    else{

      positionPlatform(
        platform,

        platformStops[
          platformIndex
        ].side,

        platformIndex < fromStep
          ? -56
          : 280,

        0
      );

    }

  });

}

/* =========================================================
   ROBOT POSITION
   ========================================================= */

function placeHero(){

  const stop =
    platformStops[
      visualStep
    ];

  const heroPosition =
    getHeroPosition(
      visualStep
    );

  const faceDir =
    visualStep > 0 &&
    stop.side === "right"
      ? -1
      : 1;


  hero.style.left =
    heroPosition.left + "%";

  hero.style.top =
    heroPosition.top + "px";


  spriteA.style.setProperty(
    "--face-dir",
    faceDir
  );

  spriteB.style.setProperty(
    "--face-dir",
    faceDir
  );


  positionBubble(
    visualStep
  );


  renderPlatforms(
    visualStep
  );

}


/* =========================================================
   ROBOT POSITION CALCULATION
   ========================================================= */

function getHeroPosition(step){

  return {

    left:
      step === 0
        ? floorHeroPosition.left
        : heroBySide[
            platformStops[
              step
            ].side
          ].left,

    top:
      step === 0
        ? Math.max(
            stage.clientHeight * .135,
            stage.clientHeight - heroHeight() - 8
          )
        : landingPlatformTop() - heroHeight()

  };

}


/* =========================================================
   BUBBLE POSITION
   ========================================================= */

function getBubblePosition(step){

  const heroPosition =
    getHeroPosition(step);

  const stageWidth =
    stage.clientWidth || 362;

  const bubbleWidth =
    stageWidth *
    (
      bubble.classList.contains(
        "large"
      )
        ? .375
        : .34
    );

  const heroCenter =
    stageWidth *
    heroPosition.left /
    100;


  if(step === 0){

    return {

      left:
        heroCenter
        -
        bubbleWidth * .58,

      top:
        heroPosition.top
        -
        (
          bubble.classList.contains(
            "large"
          )
            ? stage.clientHeight * .31
            : stage.clientHeight * .18
        )

    };

  }


  return {

    left:
      heroCenter
      -
      bubbleWidth * .5,

    top:
      heroPosition.top
      -
      (
        bubble.classList.contains(
          "large"
        )
          ? stage.clientHeight * .31
          : stage.clientHeight * .18
      )

  };

}


/* =========================================================
   POSITION BUBBLE
   ========================================================= */

function positionBubble(step){

  const bubblePosition =
    getBubblePosition(step);

  bubble.style.left =
    bubblePosition.left + "px";

  bubble.style.top =
    bubblePosition.top + "px";

}

function hideWinningFlag(){

  winningFlag.classList.remove(

  if(winningFlagTimer){

    window.clearInterval(
      winningFlagTimer
    );

  }

  winningFlagTimer = 0;

function positionWinningFlag(){

  /*
    The final platform is platformStops[5], which is the
    left-side platform. The flag is positioned relative to
    that platform and its bottom is aligned with the top of
    the red platform.
  */

  const finalPlatformWidth =
    stage.clientWidth * .387;

  const flagWidth =
    stage.clientWidth * .095;

  const imageRatio =
    winningFlag.naturalHeight &&
    winningFlag.naturalWidth
      ? winningFlag.naturalHeight /
        winningFlag.naturalWidth
      : 299 / 242;

  const flagHeight =
    flagWidth * imageRatio;

  const finalPlatformTop =
    lowerStepTop();

  winningFlag.style.left =
    `${finalPlatformWidth * .14}px`;

  winningFlag.style.top =
    `${finalPlatformTop - flagHeight + 2}px`;

}


function showWinningFlag(){

  positionWinningFlag();

  winningFlag.src =
    assets.flag[0];

  winningFlag.classList.add(
    "show"
  );

  if(winningFlagTimer){

    window.clearInterval(
      winningFlagTimer
    );

  }

  let frame = 0;

  winningFlagTimer =
    window.setInterval(
      () => {

        frame =
          (frame + 1) %
          assets.flag.length;

        winningFlag.src =
          assets.flag[frame];

      },
      260
    );

}

function renderQuestion(){
  stopEndAnimation();
  const question = sessionQuestions[current];
  locked = false;
  hideWinningFlag();

  questionLabel.textContent = `Question ${current + 1}`;
  prompt.textContent = `${current + 1}. ${question.prompt}`;
  answers.innerHTML = "";
  nextBtn.classList.remove("show");
  nextBtn.disabled = false;
  nextBtn.textContent = current === QUIZ_SIZE - 1 ? "Finish quiz" : "Next question";

  placeHero();
  setBubble("Select the correct option...", "large");
  renderLives();

  // The answer letters remain fixed in the bank; only the four visual positions are randomized.
  const displayOptions = shuffleArray(
    question.options.map((option, index) => ({
      option,
      answerLetter: String.fromCharCode(65 + index)
    }))
  );

  displayOptions.forEach(({option, answerLetter}) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.dataset.answer = answerLetter;
    button.textContent = option;
    button.addEventListener("click", () => chooseAnswer(answerLetter));
    answers.appendChild(button);
  });
}

/* =========================================================
   ANSWER
   ========================================================= */

function chooseAnswer(answerLetter){
  if(locked) return;
  locked = true;

  const question = sessionQuestions[current];
  const correct = answerLetter === question.rightAnswer;
  const buttons = [...answers.querySelectorAll(".answer")];

  // Only answered questions are recorded. Every answered question gets a 1 or 0.
  responses[current] = {
    questionCode: question.questionCode,
    workflowThemeCode: question.workflowThemeCode,
    role: question.sectionCode,
    selectedAnswer: answerLetter,
    rightAnswer: question.rightAnswer,
    score: correct ? 1 : 0
  };

  buttons.forEach(button => {
    button.disabled = true;
    if(button.dataset.answer === answerLetter){
      button.classList.add(correct ? "correct" : "wrong");
    }
    if(!correct && button.dataset.answer === question.rightAnswer){
      button.classList.add("correct");
    }
  });

  if(correct){
    score += 1;
    setBubble(question.feedback, "large");
    runJump(question.feedback);
  }else{
    livesLeft = Math.max(0, livesLeft - 1);
    stopWave();
    renderLives();

    hero.classList.remove("wrong");
    void hero.offsetWidth;
    hero.classList.add("wrong");

    setBubble(question.feedback, "large");

    // HARD STOP: losing the third life ends the attempt immediately.
    // Do NOT show Next Question and do NOT allow the current question
    // to advance to another question.
    if(livesLeft === 0){
      gameOverByLives = true;
      locked = true;

      nextBtn.classList.remove("show");
      nextBtn.disabled = true;

      game.style.display = "none";
      result.classList.add("active");

      const finalScore = responses.reduce(
        (total, response) => total + (response?.score || 0),
        0
      );

      resultScore.textContent = `${finalScore} / ${QUIZ_SIZE}`;
      resultTitle.textContent = "Game Over";
      scoreText.textContent =
        `You lost all 3 lives. Your score is ${finalScore} / ${QUIZ_SIZE}.`;

      // Loss always uses the Heartbreak animation.
      playEndAnimation(false);
      
      // Send responses to Excel after animation starts (1.5 second delay)
      console.log("⏱️ Starting timer to send responses in 1.5 seconds... (from Game Over)");
      setTimeout(() => {
        console.log("⏰ Timer fired! Calling sendResponsesToExcel() from Game Over");
        sendResponsesToExcel();
      }, 1500);
      
      return;
    }

    nextBtn.disabled = false;
    nextBtn.classList.add("show");
  }
}

/* =========================================================
   JUMP
   ========================================================= */

function runJump(message){

  stopWave();


  /*
    Keep the feedback visible during the jump. The bubble is
    repositioned when the robot lands on the next platform.
  */
  positionBubble(
    visualStep
  );


  shadow.src =
    assets.jumpShadow;


  platformLayer.style.transition =
    "none";


  if(jumpFrame){

    window.cancelAnimationFrame(
      jumpFrame
    );

  }


  const fromStep =
    visualStep;

  /*
    The robot's physical position must follow the number of
    correct answers, not the question number.

    If a question was answered incorrectly, visualStep stays
    where the robot last landed. When the next question is
    answered correctly, the robot must therefore move to the
    very next platform that it previously missed, rather than
    skipping over it.

    Example:
      Q1 wrong  -> visualStep = 0
      Q2 right  -> visualStep 0 -> platform 1
      Q3 right  -> visualStep 1 -> platform 2

    This keeps the visual game path synchronized with the
    player's actual successful answers.
  */
  const toStep =
    Math.min(
      visualStep + 1,
      platformStops.length - 1
    );


  const toSide =
    platformStops[
      toStep
    ].side;


  const fromPosition =
    getHeroPosition(
      fromStep
    );

  const toPosition =
    getHeroPosition(
      toStep
    );


  const startPlatformOffset =
    platformOffset;


  /* Move the platform layer so the landing platform sits
     just above the bottom edge, with its full red face visible. */
  const targetPlatformOffset =
    Math.max(
      0,
      landingPlatformTop()
      -
      platformLayerTop()
      -
      lowerStepTop()
    );


  const verticalShift =
    targetPlatformOffset
    -
    startPlatformOffset;


  const jumpDirection =
    toSide === "left"
      ? -1
      : 1;


  const startTime =
    performance.now();


  let lastFrameIndex =
    -1;


  spriteA.style.setProperty(
    "--face-dir",
    jumpDirection
  );

  spriteB.style.setProperty(
    "--face-dir",
    jumpDirection
  );


  function animateJump(now){

    const elapsed =
      now - startTime;


    const progress =
      Math.min(
        elapsed /
        jumpDuration,
        1
      );


    const eased =
      .5
      -
      Math.cos(
        progress * Math.PI
      ) / 2;


    const left =
      fromPosition.left
      +
      (
        toPosition.left
        -
        fromPosition.left
      )
      *
      eased;


    const top =
      fromPosition.top;


    const frameIndex =
      Math.min(
        assets.jump.length - 1,

        Math.floor(
          progress *
          assets.jump.length
        )
      );


    hero.style.left =
      left + "%";


    hero.style.top =
      top + "px";


    platformLayer.style.transform =
      `translateY(${
        startPlatformOffset
        +
        verticalShift * eased
        +
        Math.sin(
          progress * Math.PI
        ) * 64
      }px)`;


    renderJumpingPlatforms(
      fromStep,
      toStep,
      eased
    );


    if(
      frameIndex !==
      lastFrameIndex
    ){

      activeSprite.src =
        assets.jump[
          frameIndex
        ];

      activeSprite.classList.add("is-visible");
      (activeSprite === spriteA ? spriteB : spriteA)
        .classList.remove("is-visible");

      lastFrameIndex =
        frameIndex;

    }


    if(
      progress < 1
    ){

      jumpFrame =
        window.requestAnimationFrame(
          animateJump
        );

      return;
    }


    visualStep =
      toStep;


    platformOffset =
      targetPlatformOffset;


    placeHero();


    platformLayer.style.transform =
      `translateY(${platformOffset}px)`;


    platformLayer.style.transition =
      "transform 720ms cubic-bezier(.22,1,.36,1)";


    jumpFrame = 0;


    shadow.src =
      assets.waveShadow;


    startWave();


    setBubble(
      message
    );

    /*
      A winning flag appears only after the fifth correct
      answer, provided no life was lost during the run.
    */
    if(
      current === sessionQuestions.length - 1 &&
      score === sessionQuestions.length
    ){

      showWinningFlag();

    }


    nextBtn.classList.add(
      "show"
    );

  }


  jumpFrame =
    window.requestAnimationFrame(
      animateJump
    );

}


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz(){

  if(!selectedRole){
    roleSelectTrigger.focus();
    return;
  }

  const availableQuestions = questionBank.filter(question => question.sectionCode === selectedRole);
  if(availableQuestions.length < QUIZ_SIZE){
    setBubble("There are not enough questions for this role yet.", "large");
    return;
  }

  /*
    Every quiz run gets a fresh random set of five questions
    from the selected role's question bank. The previous exact set is avoided
    when possible so a new run feels genuinely different.
  */
  sessionQuestions = createQuizSession(selectedRole);


  landing.style.display =
    "none";


  game.classList.remove(
    "hidden"
  );


  current = 0;

  visualStep = 0;

  platformOffset = 0;

  score = 0;
  responses = [];

  livesLeft = 3;

  gameOverByLives = false;

  hideWinningFlag();


  platformLayer.style.transform =
    "none";


  renderQuestion();

  startWave();

}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion(){
  if(!locked || gameOverByLives || livesLeft <= 0) return;

  current += 1;

  if(current >= QUIZ_SIZE){
    showResult();
    return;
  }

  renderQuestion();
  startWave();
}

function stopEndAnimation(){
  if(endAnimationTimer){
    window.clearInterval(endAnimationTimer);
  }
  endAnimationTimer = 0;
}

function playEndAnimation(won){
  stopEndAnimation();

  const frames = won ? assets.trofee : assets.heartbreak;
  const type = won ? "trofee" : "heartbreak";

  resultAnimation.classList.remove("trofee", "heartbreak");
  resultAnimation.classList.add(type);

  let frame = 0;
  resultAnimationFrame.src = frames[frame];

  // Delay animation start by 1 second, then play once; leave the final frame visible.
  endAnimationTimer = window.setTimeout(() => {
    endAnimationTimer = window.setInterval(() => {
      frame += 1;
      if(frame >= frames.length){
        stopEndAnimation();
        return;
      }
      resultAnimationFrame.src = frames[frame];
    }, 280);
  }, 1000);
}

/* =========================================================
   EXCEL INTEGRATION
   ========================================================= */

const GOOGLE_SHEETS_WEBHOOK = "https://script.google.com/macros/s/AKfycby7jqz9WL_zp5n-xfiNCEJ5HliASSuAmscbFx9RRmQPc7RcgfwIeNsTfTpqcfc5_snxVQ/exec";

function generateSerialNumber(){
  return `QZ-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`.toUpperCase();
}

function formatResponsesForExcel(){
  console.log("📦 Formatting responses for Excel...");
  
  const serialNumber = generateSerialNumber();
  const timestamp = new Date().toISOString();
  
  // Get role name from code
  const roleMap = {
    "M": "Management",
    "DS": "Design",
    "DEV": "Development",
    "TST": "Testing",
    "ENG": "Engineering",
    "STK": "Stakeholder / Sales"
  };
  const roleName = roleMap[selectedRole] || selectedRole;
  
  // Build flat object with individual columns for each question
  const finalData = {
    serialNumber,
    timestamp,
    role: roleName
  };
  
  // Add each question's data as separate columns
  responses.forEach((response, index) => {
    const qNum = index + 1;
    if(response){
      finalData[`Q${qNum}_Code`] = response.questionCode || "";
      finalData[`Q${qNum}_Score`] = response.score || 0;
      finalData[`Q${qNum}_Workflow`] = response.workflowThemeCode || "";
    }
  });
  
  // Add total score
  finalData.Total_Score = responses.reduce((sum, r) => sum + (r?.score || 0), 0);
  
  console.log("✅ Formatted data:", finalData);
  return finalData;
}

function sendResponsesToExcel(){
  console.log("🚀 SENDING RESPONSES TO GOOGLE SHEETS");
  
  if(!selectedRole){
    console.error("❌ ERROR: No role selected!");
    return;
  }
  
  if(responses.length === 0){
    console.error("❌ ERROR: No responses collected!");
    return;
  }
  
  const data = formatResponsesForExcel();
  
  console.log("📡 Google Sheets Webhook URL:", GOOGLE_SHEETS_WEBHOOK);
  console.log("📤 Sending payload:", JSON.stringify(data, null, 2));
  
  // Send to Google Sheets
  fetch(GOOGLE_SHEETS_WEBHOOK, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(response => {
    console.log("✅ Response received! Status:", response.status);
    if(!response.ok){
      console.error("❌ HTTP Error:", response.status, response.statusText);
      return response.text().then(text => {
        console.error("Response body:", text);
      });
    }
    console.log("✅✅✅ DATA SENT SUCCESSFULLY TO GOOGLE SHEETS!");
    return response.json().catch(() => ({}));
  })
  .catch(error => {
    console.error("❌ FETCH ERROR:", error.message);
    console.error("Full error:", error);
  });
}

/* =========================================================
   RESULT
   ========================================================= */

function showResult(){
  console.log("📊 SHOW RESULT CALLED");
  console.log("Selected Role:", selectedRole);
  console.log("Responses collected:", responses.length);
  
  stopWave();
  gameOverByLives = false;

  game.style.display = "none";
  result.classList.add("active");

  const answeredCount = responses.filter(Boolean).length;
  const finalScore = responses.reduce((total, response) => total + (response?.score || 0), 0);
  const won = finalScore === QUIZ_SIZE;

  resultScore.textContent = `${finalScore} / ${QUIZ_SIZE}`;
  resultTitle.textContent = won ? "You Win!" : "Quiz Complete";
  scoreText.textContent = won
    ? "Excellent! You got all 5 questions correct."
    : `You completed all ${answeredCount} questions with ${finalScore} correct.`;

  playEndAnimation(won);
  
  // Send responses to Excel after animation starts (1.5 second delay)
  console.log("⏱️ Starting timer to send responses in 1.5 seconds...");
  setTimeout(() => {
    console.log("⏰ Timer fired! Calling sendResponsesToExcel()");
    sendResponsesToExcel();
  }, 1500);
}

/* =========================================================
   WAVE
   ========================================================= */

function startWave(){

  stopWave();

  let frame = 0;
  let direction = 1;
  let completedCycles = 0;

  /*
    Four supplied wave poses are played as a gentle ping-pong loop:

      Wave 1 → Wave 2 → Wave 3 → Wave 4 → Wave 3 → Wave 2 → ...

    Two identical sprite layers crossfade between poses. This makes
    the hand movement feel much less abrupt while keeping the robot's
    feet and body anchored to the same position.
  */
  const frameDuration = 145;
  const crossfadeDuration = 125;

  spriteA.style.transition =
    `opacity ${crossfadeDuration}ms linear`;

  spriteB.style.transition =
    `opacity ${crossfadeDuration}ms linear`;

  activeSprite = spriteA;

  spriteA.src =
    assets.wave[0];

  spriteB.src =
    assets.wave[0];

  spriteA.classList.add("is-visible");
  spriteB.classList.remove("is-visible");

  let lastFrameTime =
    performance.now();

  function showFrame(nextFrame){

    const nextSprite =
      activeSprite === spriteA
        ? spriteB
        : spriteA;

    nextSprite.src =
      assets.wave[nextFrame];

    /*
      The four wave images are preloaded at startup. The small
      requestAnimationFrame delay lets the browser paint the new
      image before the opacity transition begins.
    */
    window.requestAnimationFrame(() => {

      nextSprite.classList.add(
        "is-visible"
      );

      activeSprite.classList.remove(
        "is-visible"
      );

      activeSprite =
        nextSprite;

    });
  }

  function animateWave(now){

    if(!waveTimer){
      return;
    }

    const elapsed =
      now - lastFrameTime;

    if(elapsed >= frameDuration){

      const steps =
        Math.min(
          2,
          Math.floor(
            elapsed / frameDuration
          )
        );

      for(
        let step = 0;
        step < steps;
        step += 1
      ){

        frame += direction;

        if(
          frame >=
          assets.wave.length - 1
        ){

          frame =
            assets.wave.length - 1;

          direction = -1;

        }else if(frame <= 0){

          frame = 0;

          direction = 1;

          completedCycles += 1;

        }

        showFrame(frame);

        if(completedCycles >= 2){

          stopWave();

          return;

        }

      }

      lastFrameTime +=
        steps * frameDuration;
    }

    waveTimer =
      window.requestAnimationFrame(
        animateWave
      );
  }

  waveTimer =
    window.requestAnimationFrame(
      animateWave
    );
}

/* =========================================================
   STOP WAVE
   ========================================================= */

function stopWave(){

  if(waveTimer){

    window.cancelAnimationFrame(
      waveTimer
    );

  }

  waveTimer = 0;

}


/* =========================================================
   LANDING EVENTS
   ========================================================= */

function enableRoleDropdown(){
  roleSelectTrigger.disabled = false;
  roleSelectTrigger.removeAttribute("disabled");
  roleSelectTrigger.setAttribute("aria-disabled", "false");
}

// Only the Start Quiz button is disabled until a role is selected.
// The role dropdown itself must always remain interactive.
startQuizBtn.disabled = true;
startQuizBtn.setAttribute("aria-disabled", "true");
enableRoleDropdown();

function closeRoleDropdown(){
  roleDropdown.classList.remove("open");
  roleSelectTrigger.setAttribute("aria-expanded", "false");
}

function openRoleDropdown(){
  roleDropdown.classList.add("open");
  roleSelectTrigger.setAttribute("aria-expanded", "true");
}

roleSelectTrigger.addEventListener("click", event => {
  event.stopPropagation();
  roleDropdown.classList.contains("open") ? closeRoleDropdown() : openRoleDropdown();
});

roleOptions.forEach(option => {
  option.addEventListener("click", () => {
    selectedRole = option.dataset.value;
    roleSelectValue.textContent = option.textContent.trim();
    roleSelectTrigger.classList.remove("placeholder");
    roleOptions.forEach(item => {
      const selected = item === option;
      item.classList.toggle("selected", selected);
      item.setAttribute("aria-selected", String(selected));
    });
    startQuizBtn.disabled = false;
    startQuizBtn.setAttribute("aria-disabled", "false");
    closeRoleDropdown();
  });
});

document.addEventListener("click", event => {
  if(!roleDropdown.contains(event.target)) closeRoleDropdown();
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape") closeRoleDropdown();
});

startQuizBtn.addEventListener("click", startQuiz);


/* =========================================================
   NEXT
   ========================================================= */

nextBtn.addEventListener(
  "click",
  nextQuestion
);


/* =========================================================
   RESTART
   ========================================================= */

restartBtn.addEventListener(
  "click",
  () => {

    // Play Again always returns to the landing page.
    stopWave();
    hideWinningFlag();
    stopEndAnimation();
    resultAnimationFrame.src = "";

    current = 0;
    visualStep = 0;
    platformOffset = 0;
    score = 0;
    responses = [];
    livesLeft = 3;
    gameOverByLives = false;
    selectedRole = "";
    locked = false;

    result.classList.remove(
      "active"
    );

    game.style.display =
      "none";

    landing.style.display =
      "block";

    roleSelectValue.textContent =
      "Choose your role";

    roleSelectTrigger.classList.add(
      "placeholder"
    );

    roleOptions.forEach(option => {
      option.classList.remove("selected");
      option.setAttribute("aria-selected", "false");
    });

    closeRoleDropdown();

    startQuizBtn.disabled = true;

    nextBtn.disabled = false;

    startQuizBtn.setAttribute(
      "aria-disabled",
      "true"
    );

    // Keep the role dropdown enabled after restarting.
    enableRoleDropdown();

    platformLayer.style.transform =
      "none";

  }
);



window.addEventListener(
  "resize",
  () => {

    if(
      winningFlag.classList.contains(
        "show"
      )
    ){

      positionWinningFlag();

    }

  }
);

/* =========================================================
   INITIALIZE
   ========================================================= */

buildPlatforms();

</script>
